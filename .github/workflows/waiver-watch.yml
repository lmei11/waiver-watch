# Put this file at .github/workflows/waiver-watch.yml in your repo.
#
# Start it from GitHub: Actions tab -> "Waiver watch" -> "Run workflow",
# enter a player name (or ID), and press the green button. It waits until
# 3:00 AM ET, polls every 30s until 5:00 AM ET, then stops.
#
# Repo secrets it uses (Settings -> Secrets and variables -> Actions):
#   ESPN_LEAGUE_ID  (required)
#   NTFY_TOPIC      (required in practice - it's how you get notified)
#   ESPN_S2, ESPN_SWID  (private leagues only)

name: Waiver watch

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Player name (full or partial, e.g. jokic)"
        required: false
        type: string
      player:
        description: "Or: ESPN player ID (used if no name is given)"
        required: false
        type: string
      now:
        description: "Poll right away, ignoring the 3-5 AM ET window"
        required: false
        type: boolean
        default: false

# Only one watch at a time: starting a new run cancels an older one still waiting.
concurrency:
  group: waiver-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub's hard limit is 6 hours (360 min). Start the run after ~11 PM ET
    # so the whole 3-5 AM window fits.
    timeout-minutes: 360

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch waivers
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Inputs go through env vars, not straight into the script line,
          # so odd characters in a name can't break the command.
          INPUT_NAME: ${{ inputs.name }}
          INPUT_PLAYER: ${{ inputs.player }}
          INPUT_NOW: ${{ inputs.now }}
        run: |
          args=(--one-window)
          if [ -n "$INPUT_NAME" ]; then
            args+=(--name "$INPUT_NAME")
          elif [ -n "$INPUT_PLAYER" ]; then
            args+=(--player "$INPUT_PLAYER")
          else
            echo "Enter a player name or ID when you start the run." >&2
            exit 1
          fi
          if [ "$INPUT_NOW" = "true" ]; then
            args+=(--now)
          fi
          python3 waiver_watch.py "${args[@]}"

      # If anything above fails (bad name, ESPN error, timeout), ping your phone
      # so you don't sit there assuming it's still watching.
      - name: Notify on failure
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Waiver watch failed" -H "Priority: high" -H "Click: $RUN_URL" \
              -d "The waiver watch stopped with an error. Tap to see the log." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
